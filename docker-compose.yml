services:
  app:
    container_name: flamenodes-dev

    image: node:22-alpine

    working_dir: /app

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development

      # Docker HMR fixes
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flamenodes
      REDIS_URL: redis://redis:6379

    volumes:
      # Live sync current directory
      - .:/app

      # Keep container node_modules isolated
      - node_modules:/app/node_modules

      # Optional pnpm cache
      - pnpm_store:/pnpm/store

    command: >
      sh -c "
      corepack disable &&
      npm install -g pnpm@10 &&
      pnpm install &&
      pnpm dev
      "

    depends_on:
      - postgres
      - redis

    stdin_open: true
    tty: true

  postgres:
    container_name: flamenodes-postgres

    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flamenodes

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

  redis:
    container_name: flamenodes-redis

    image: redis:7-alpine

    restart: unless-stopped

    command: redis-server --appendonly yes --protected-mode yes

    volumes:
      - redis_data:/data

    expose:
      - "6379"

volumes:
  node_modules:
  pnpm_store:
  postgres_data:
  redis_data:
